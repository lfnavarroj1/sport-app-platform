# Servicio Cloud Run web para Cloud Deploy (target production-web, pipeline
# frontend-web). Los valores marcados con from-param los fija Terraform como
# parámetros del target: un rollout solo cambia la imagen. Sin salida a la VPC.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1" # from-param: ${min_instances}
        autoscaling.knative.dev/maxScale: "10" # from-param: ${max_instances}
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: run-web # from-param: ${service_account}
      containerConcurrency: 80 # from-param: ${concurrency}
      timeoutSeconds: 30 # from-param: ${timeout_seconds}
      containers:
        - image: sportapp/web
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1" # from-param: ${cpu}
              memory: 512Mi # from-param: ${memory}
          env:
            - name: APP_ENV
              value: production # from-param: ${env_APP_ENV}
            - name: BFF_WEB_BASE_URL
              value: https://bff-web # from-param: ${env_BFF_WEB_BASE_URL}
            - name: REGISTRATION_POLICIES_VERSION
              value: sin-definir # from-param: ${env_REGISTRATION_POLICIES_VERSION}
            - name: HEALTH_DATA_CONSENT_VERSION
              value: sin-definir # from-param: ${env_HEALTH_DATA_CONSENT_VERSION}
