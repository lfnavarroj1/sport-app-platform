# Emulador oficial de Pub/Sub. No reproduce IAM ni cuotas de GCP.
#
# El emulador guarda todo en memoria: cada vez que el contenedor arranca vuelve
# a crear los tópicos, suscripciones y DLQ de GCP (pubsub-init/create-resources.sh)
# y solo queda listo cuando terminó. Si el emulador se detiene, el contenedor
# termina y Kubernetes lo reinicia con los recursos de nuevo.
apiVersion: v1
kind: Service
metadata:
  name: pubsub-emulator
  labels:
    app.kubernetes.io/name: pubsub-emulator
spec:
  selector:
    app.kubernetes.io/name: pubsub-emulator
  ports:
    - {name: grpc, port: 8085, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-emulator
  labels:
    app.kubernetes.io/name: pubsub-emulator
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pubsub-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-emulator
        app.kubernetes.io/component: messaging
    spec:
      automountServiceAccountToken: false
      containers:
        - name: emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-emulators@sha256:be2f0e582a94c9e06e7a384fe2b3b39d590eeb8da65a110eda991598c100fe80
          command:
            - sh
            - -c
            - |
              gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 &
              emulator=$!
              trap 'kill "$emulator"' TERM INT
              if ! PUBSUB_EMULATOR_HOST=localhost:8085 sh /scripts/create-resources.sh; then
                kill "$emulator"
                exit 1
              fi
              touch /tmp/pubsub-resources-ready
              wait "$emulator"
          env:
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_PROJECT_ID}
            # Los mismos nombres y políticas que crea Terraform en GCP.
            # sportapp.afiliacion.v1 y sportapp.servicios.v1 no tienen suscripción: no hay consumidor aprobado.
            - name: PUBSUB_TOPICS
              value: sportapp.usuarios.v1 sportapp.afiliacion.v1 sportapp.servicios.v1 sportapp.entrenamientos.v1 sportapp.eventos.v1
            # <suscripción> <tópico> <DLQ> <entregas> [filtro]
            #   usuarios: CMP-001 (HU001); alta gratuita: ADR-024 y R-19 (HU001);
            #   entrenamientos: CMP-003 (HU010); eventos: CMP-004.
            - name: PUBSUB_SUBSCRIPTIONS
              value: |
                proyector-usuarios-v1 sportapp.usuarios.v1 sportapp.usuarios.proyeccion.dlq 5
                sportapp.afiliacion.alta-gratuita.v1 sportapp.usuarios.v1 sportapp.afiliacion.alta-gratuita.dlq 10 attributes.event_type = "usuario.registrado.v1"
                proyector-entrenamientos-v1 sportapp.entrenamientos.v1 sportapp.entrenamientos.proyeccion.dlq 10
                proyector-eventos-v1 sportapp.eventos.v1 sportapp.eventos.proyeccion.dlq 10
          ports:
            - {name: grpc, containerPort: 8085}
          readinessProbe:
            exec:
              command: [test, -f, /tmp/pubsub-resources-ready]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: pubsub-init}
