# Crea en el emulador los mismos tópicos, suscripciones y DLQ que existen en
# GCP (infra/terraform/modules/gcp/pubsub). Es idempotente.
apiVersion: batch/v1
kind: Job
metadata:
  name: pubsub-init
  labels:
    app.kubernetes.io/name: pubsub-init
    app.kubernetes.io/component: pubsub-setup
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-init
        app.kubernetes.io/component: pubsub-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: init
          image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          command: [sh, /scripts/create-resources.sh]
          env:
            - name: PUBSUB_DOMAINS
              value: usuarios entrenamientos eventos
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_PROJECT_ID}
            - name: PUBSUB_EMULATOR_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_EMULATOR_HOST}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: pubsub-init}
